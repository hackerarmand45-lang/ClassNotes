const seed=[
{id:'n1',title:'Differentiation, made simple',subject:'Mathematics',grade:'12',type:'notes',teacher:'Ms. Ananya Sharma',description:'A concise introduction to derivatives, with rules and worked examples.',text:'DIFFERENTIATION — QUICK NOTES\n\nA derivative measures the instantaneous rate of change. Geometrically, it is the slope of a tangent.\n\nDefinition: f′(x) = lim as h → 0 of [f(x+h) − f(x)] / h.\n\nKEY RULES\n• Power rule: d(x^n)/dx = n x^(n−1).\n• Constant rule: d(c)/dx = 0.\n• Product rule: (uv)′ = u′v + uv′.\n• Chain rule: [f(g(x))]′ = f′(g(x))g′(x).\n\nWORKED EXAMPLE\ny = (3x + 1)^4\ny′ = 4(3x + 1)^3 × 3 = 12(3x + 1)^3.\n\nTRY IT\nDifferentiate y = x^3 − 5x^2 + 4.\nAnswer: y′ = 3x^2 − 10x.\n\nIllustrative demo notes, not a complete syllabus.'},
{id:'n2',title:'Current electricity: key concepts',subject:'Physics',grade:'12',type:'notes',teacher:'Mr. Rahul Mehta',description:'Ohm’s law, resistance and the essentials of simple circuits.',text:'CURRENT ELECTRICITY — QUICK NOTES\n\nCurrent I = Q/t, measured in amperes. Potential difference is energy transferred per unit charge: V = W/Q.\n\nOHM’S LAW\nV = IR for an ohmic conductor under constant physical conditions such as temperature.\n\nRESISTORS\nSeries: R_total = R1 + R2 + …\nParallel: 1/R_total = 1/R1 + 1/R2 + …\n\nPOWER\nP = VI = I^2 R = V^2/R for a resistor.\n\nEXAMPLE\nA 6 Ω resistor is connected across 12 V.\nI = 12/6 = 2 A. Power = 12 × 2 = 24 W.\n\nPRACTICE\nTwo 4 Ω resistors in parallel have equivalent resistance 2 Ω. Across 6 V, the total current is 3 A.\n\nIllustrative demo notes, not a complete syllabus.'},
{id:'p1',title:'Chemistry practice paper — Set A',subject:'Chemistry',grade:'12',type:'papers',teacher:'Ms. Priya Nair',description:'A short 10-mark practice set with an answer key. Suggested time: 20 minutes.',text:'CHEMISTRY — DEMO PRACTICE PAPER\nClass 12 • 10 marks • Suggested time: 20 minutes\n\n1. Define molarity and state its unit. (2 marks)\n2. Calculate the molarity of a solution containing 0.5 mol solute in 2 L of solution. (2 marks)\n3. State the oxidation state of chromium in K2Cr2O7. Show working. (2 marks)\n4. Explain why transition metals often form coloured ions. (2 marks)\n5. Name the functional group in CH3COOH. (2 marks)\n\nANSWER KEY\n1. Moles of solute per litre of solution; mol L^−1.\n2. M = 0.5/2 = 0.25 mol L^−1.\n3. 2(+1) + 2x + 7(−2) = 0; x = +6.\n4. Many have partially filled d orbitals. In a ligand field, transitions between split d energy levels absorb visible light.\n5. Carboxyl group (−COOH).\n\nThis is an illustrative practice set, not an official board examination paper.'},
{id:'n3',title:'The cell: a revision companion',subject:'Biology',grade:'11',type:'notes',teacher:'Ms. Kavya Rao',description:'A quick guide to cell structures and their functions.',text:'THE CELL — REVISION NOTES\n\nThe cell is the basic structural and functional unit of life.\n\nKEY STRUCTURES\n• Plasma membrane: selectively controls movement into and out of the cell.\n• Nucleus: contains most of a eukaryotic cell’s genetic material.\n• Mitochondria: major sites of aerobic ATP production.\n• Ribosomes: sites of protein synthesis.\n• Golgi apparatus: modifies, sorts and packages proteins and lipids.\n• Chloroplasts: sites of photosynthesis in plants and algae.\n\nPROKARYOTIC VS EUKARYOTIC\nProkaryotes lack a membrane-bound nucleus and membrane-bound organelles. Eukaryotes have a membrane-bound nucleus and compartmentalised organelles. Both have DNA, a plasma membrane and ribosomes.\n\nCHECK YOUR UNDERSTANDING\nWhy do plant cells have both mitochondria and chloroplasts?\nPlants photosynthesise to store energy in organic molecules and respire to release usable energy as ATP.\n\nIllustrative demo notes, not a complete syllabus.'},
{id:'p2',title:'Mathematics practice paper — Set A',subject:'Mathematics',grade:'12',type:'papers',teacher:'Ms. Ananya Sharma',description:'Five revision questions on derivatives and integrals, with answers.',text:'MATHEMATICS — DEMO PRACTICE PAPER\nClass 12 • 10 marks • Suggested time: 20 minutes\n\nEach question carries 2 marks.\n1. Differentiate x^4 − 3x + 2.\n2. Differentiate sin(2x).\n3. Evaluate the indefinite integral of 3x^2 with respect to x.\n4. Evaluate the definite integral of 2x from 0 to 3.\n5. Find the slope of y = x^2 at x = 2.\n\nANSWER KEY\n1. 4x^3 − 3\n2. 2 cos(2x)\n3. x^3 + C\n4. [x^2] from 0 to 3 = 9\n5. dy/dx = 2x; at x = 2 the slope is 4.\n\nThis is an illustrative practice set, not an official board examination paper.'},
{id:'n4',title:'Chemical bonding essentials',subject:'Chemistry',grade:'11',type:'notes',teacher:'Ms. Priya Nair',description:'Ionic and covalent bonds, molecular shapes and polarity.',text:'CHEMICAL BONDING — QUICK NOTES\n\nIONIC BONDING\nElectrostatic attraction between oppositely charged ions. Sodium chloride is a common example. Ionic solids generally have high melting points and conduct electricity when molten or dissolved if ions can move.\n\nCOVALENT BONDING\nAtoms share electron pairs. A single bond contains one shared pair, a double bond two, and a triple bond three.\n\nMOLECULAR SHAPE\nVSEPR theory: electron domains around a central atom arrange to minimise repulsion.\n• CO2: linear, 180°.\n• CH4: tetrahedral, approximately 109.5°.\n• H2O: bent, approximately 104.5°.\n\nPOLARITY\nBond polarity depends on electronegativity difference. Molecular polarity also depends on shape. CO2 has polar bonds but is nonpolar overall because its bond dipoles cancel.\n\nIllustrative demo notes, not a complete syllabus.'}];
let resources=[...seed],saved=new Set(),db=null,storageMessage='',current='home',query='',subjectFilter='',gradeFilter='',sort='recommended',picked=null;const main=document.getElementById('main');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{saved=new Set(JSON.parse(localStorage.getItem('classnote-saved')||'[]'))}catch{}
function notify(t){document.getElementById('toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function updateCount(){document.getElementById('saved-count').textContent=saved.size}updateCount();
function persistSave(){try{localStorage.setItem('classnote-saved',JSON.stringify([...saved]));return true}catch{return false}}
function card(r){return '<article class="resource"><div class="card-top"><div class="file-icon '+(r.type==='papers'?'paper':'')+'">'+icon(r.type==='papers'?'file':'book')+'</div><button class="icon-btn '+(saved.has(r.id)?'saved':'')+'" data-save="'+esc(r.id)+'" aria-label="'+(saved.has(r.id)?'Unsave':'Save')+' '+esc(r.title)+'" aria-pressed="'+saved.has(r.id)+'">'+icon('bookmark')+'</button></div><div class="tags"><span class="tag subject-tag">'+esc(r.subject)+'</span><span class="tag">Class '+esc(r.grade)+'</span></div><h3>'+esc(r.title)+'</h3><p class="author">By '+esc(r.teacher)+'</p><div class="card-bottom"><span>'+(r.local?esc((r.size/1024).toFixed(0)+' KB · '+r.filename.split('.').pop().toUpperCase()):'Demo · TXT')+' &nbsp; · &nbsp; '+(r.type==='papers'?'Practice paper':'Class notes')+'</span><button class="open-btn" data-open="'+esc(r.id)+'">View '+icon('arrow')+'</button></div></article>'}
function footer(){return '<footer class="footer"><span>Classnote © 2026 · Made for curious minds.</span><span>Learn a little. Grow a lot.</span></footer>'}
function head(title,sub,cta=true){return '<div class="page-head"><div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div>'+(cta?'<a class="btn primary" href="#teach">'+icon('upload')+' Upload resource</a>':'')+'</div>'}
function home(){main.innerHTML=head('A good day to learn.','Your next breakthrough starts with the right resources.')+'<section class="hero"><div class="hero-copy"><div class="eyebrow">Less searching. More learning.</div><h2>Great notes.<br>Even greater possibilities.</h2><p>Teacher-shared notes and practice papers.<br>All in one thoughtful little space.</p><a class="btn lime" href="#notes">Explore the library '+icon('arrow')+'</a></div><div class="hero-art" aria-hidden="true"><div class="orb"></div><div class="sheet"><b>CLASS NOTES</b><span></span><span></span><span></span><div style="font-size:30px;margin-top:20px">ƒ(x)</div><span></span></div><div class="sheet two"><b>SMALL STEPS.</b><strong>Big ideas.</strong><span></span><span></span></div><div class="spark">✳</div></div></section><section class="metrics" aria-label="Library statistics"><div class="metric"><div class="metric-icon">'+icon('book')+'</div><div><strong>'+resources.filter(r=>r.type==='notes').length+'</strong><small>Notes to explore</small></div></div><div class="metric"><div class="metric-icon">'+icon('file')+'</div><div><strong>'+resources.filter(r=>r.type==='papers').length+'</strong><small>Practice papers</small></div></div><div class="metric"><div class="metric-icon">'+icon('bookmark')+'</div><div><strong>'+saved.size+'</strong><small>Saved for later</small></div></div></section><section><div class="section-heading"><h2>Find your subject</h2><span class="text-link">A little focus goes a long way</span></div><div class="subjects">'+subjects.map((s,i)=>'<button class="subject" data-subject="'+s+'"><span class="subject-symbol" style="background:'+colors[i]+'">'+symbols[i]+'</span><span><b>'+s+'</b><small>'+resources.filter(r=>r.subject===s).length+' resources</small></span></button>').join('')+'</div></section><section><div class="section-heading"><h2>From the resource shelf</h2><a href="#notes" class="text-link">View all notes &nbsp; →</a></div><div class="grid">'+resources.slice(0,3).map(card).join('')+'</div></section><section class="bottom-banner"><div class="metric-icon">'+icon('sprout')+'</div><div><h3>Something worth sharing?</h3><p>Your notes could be someone else’s lightbulb moment.</p></div><a class="btn" href="#teach">Visit teacher workspace '+icon('arrow')+'</a></section>'+footer()}
function catalog(){let title=current==='notes'?'The notes library.':current==='papers'?'Practice makes progress.':'Your personal bookshelf.';let sub=current==='notes'?'Clear concepts. Helpful explanations. A better place to start.':current==='papers'?'Put your understanding to the test, one paper at a time.':'Keep the resources you want to come back to.';main.innerHTML=head(title,sub)+'<div class="toolbar"><div class="search">'+icon('search')+'<input id="search" type="search" placeholder="Search by title, subject or teacher…" aria-label="Search resources" value="'+esc(query)+'"></div><select id="subject-filter" aria-label="Filter by subject"><option value="">All subjects</option>'+subjects.map(s=>'<option '+(subjectFilter===s?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="grade-filter" aria-label="Filter by class"><option value="">All classes</option>'+['9','10','11','12'].map(g=>'<option value="'+g+'" '+(gradeFilter===g?'selected':'')+'>Class '+g+'</option>').join('')+'</select><select id="sort" aria-label="Sort resources"><option value="recommended">Recommended</option><option value="title" '+(sort==='title'?'selected':'')+'>Title A–Z</option><option value="new" '+(sort==='new'?'selected':'')+'>Newest uploads</option></select></div><div class="result-count" id="result-count"></div><div class="grid" id="results"></div>'+footer();renderResults();document.getElementById('search').addEventListener('input',e=>{query=e.target.value;renderResults()});document.getElementById('subject-filter').onchange=e=>{subjectFilter=e.target.value;renderResults()};document.getElementById('grade-filter').onchange=e=>{gradeFilter=e.target.value;renderResults()};document.getElementById('sort').onchange=e=>{sort=e.target.value;renderResults()}}
function renderResults(){let rows=resources.filter(r=>(current==='saved'?saved.has(r.id):r.type===current)&&(!subjectFilter||r.subject===subjectFilter)&&(!gradeFilter||r.grade===gradeFilter)&&(!query||[r.title,r.subject,r.teacher].join(' ').toLowerCase().includes(query.toLowerCase())));if(sort==='title')rows.sort((a,b)=>a.title.localeCompare(b.title));if(sort==='new')rows.sort((a,b)=>(b.created||0)-(a.created||0));document.getElementById('result-count').textContent=rows.length+' resource'+(rows.length===1?'':'s')+' · '+(current==='saved'?'Your saved collection':'Includes illustrative demo content');document.getElementById('results').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">'+icon(current==='saved'?'bookmark':'search')+'<h3>'+(current==='saved'&&!query&&!subjectFilter&&!gradeFilter?'Your shelf is waiting.':'No resources found.')+'</h3><p>'+(current==='saved'?'Save resources using the bookmark icon, or try different filters.':'Try another search or subject. Teachers can add resources in the workspace.')+'</p><a href="#notes" class="btn">Browse class notes</a></div>'}
function teach(){main.innerHTML=head('A little sharing. A lot of impact.','Give your students a clearer path to understanding.',false)+'<div class="notice"><strong>Local demo workspace.</strong> Files are stored only in this browser, not shared with other users. There is no account authentication or school server connected. '+esc(storageMessage||'You can upload a real file and try the student library on this device.')+'</div><div class="upload-layout"><section class="panel"><h2>Share a resource</h2><form id="upload-form"><div class="form-grid"><div class="field full"><label for="title">Resource title</label><input id="title" name="title" required maxlength="100" placeholder="e.g. Integration — chapter revision notes"></div><div class="field"><label for="teacher">Teacher name</label><input id="teacher" name="teacher" required maxlength="70" placeholder="Your name"></div><div class="field"><label for="type">Resource type</label><select id="type" name="type"><option value="notes">Class notes</option><option value="papers">Sample paper</option></select></div><div class="field"><label for="subject">Subject</label><select id="subject" name="subject">'+subjects.map(s=>'<option>'+s+'</option>').join('')+'</select></div><div class="field"><label for="grade">Class</label><select id="grade" name="grade"><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12" selected>Class 12</option></select></div><div class="field full"><label for="description">A short description</label><textarea id="description" name="description" maxlength="500" placeholder="What will students learn? Any chapters or instructions to keep in mind?"></textarea></div><div class="field full"><label for="resource-file">Resource file</label><div class="drop" id="drop">'+icon('upload')+'<strong id="file-label">Choose a file or drop it here</strong><small>PDF, DOCX or TXT · Up to 10 MB</small><input id="resource-file" type="file" accept=".pdf,.docx,.txt" aria-label="Choose resource file"></div></div></div><div class="form-actions"><small style="color:var(--muted);font-size:10px">Only share material you have permission to distribute.</small><button class="btn primary" type="submit" id="publish">'+icon('upload')+' Add to local library</button></div><div id="form-status" role="status" aria-live="polite"></div></form></section><aside class="panel help"><div style="color:#779657;margin-bottom:18px">'+icon('sprout')+'</div><h3>A useful resource starts here.</h3><ol><li>Give it a descriptive title.</li><li>Choose the subject and class.</li><li>Attach readable, complete notes.</li><li>Include answers for practice papers.</li></ol><hr><h3>Make learning feel lighter.</h3><p class="sub">A worked example, a helpful diagram, or a few thoughtful questions can make all the difference.</p><hr><p class="sub">Demo uploads are available on this browser only. Clearing browser data removes them. Production use needs secure accounts, file storage and access controls.</p></aside></div><section class="myuploads"><div class="section-heading"><h2>Uploads on this browser</h2><span class="text-link">'+resources.filter(r=>r.local).length+' resources</span></div><div class="grid">'+(resources.filter(r=>r.local).map(card).join('')||'<div class="empty"><h3>Your first resource starts above.</h3><p>Once added, it will appear here and in the student library.</p></div>')+'</div></section>'+footer();picked=null;const file=document.getElementById('resource-file'),drop=document.getElementById('drop');file.onchange=()=>pick(file.files[0]);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');pick(e.dataTransfer.files[0])};document.getElementById('upload-form').onsubmit=upload}
function pick(file){if(!file)return;if(!/\.(pdf|docx|txt)$/i.test(file.name)){picked=null;document.getElementById('file-label').textContent='Choose a file or drop it here';notify('Please choose a PDF, DOCX or TXT file.');return}if(file.size>1*1024*1024||file.size===0){picked=null;document.getElementById('file-label').textContent='Choose a file or drop it here';notify('Choose a non-empty file under 10 MB.');return}picked=file;document.getElementById('file-label').textContent=file.name+' · '+(file.size/1024).toFixed(0)+' KB'}
function saveResource(record){return new Promise((resolve,reject)=>{if(!db)return reject(new Error('Browser storage is unavailable. Your file was not saved.'));let tx=db.transaction('resources','readwrite');tx.objectStore('resources').put(record);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Storage failed.'));tx.onabort=()=>reject(tx.error||new Error('Storage transaction aborted.'))})}
async function upload(e){e.preventDefault();const form=e.currentTarget,status=document.getElementById('form-status'),button=document.getElementById('publish');status.className='error';if(!picked){status.textContent='Please attach a PDF, DOCX or TXT file.';return}const f=new FormData(form);if(!f.get('title').trim()||!f.get('teacher').trim()){status.textContent='Please enter a title and teacher name.';return}button.disabled=true;button.textContent='Saving to this browser…';const r={id:'local-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)),title:f.get('title').trim(),teacher:f.get('teacher').trim(),type:f.get('type'),subject:f.get('subject'),grade:f.get('grade'),description:f.get('description').trim(),file:picked,filename:picked.name,size:picked.size,local:true,created:Date.now()};try{await saveResource(r);resources.unshift(r);if(current==='teach')teach();notify('Resource saved to this browser’s library.');}catch(err){if(status.isConnected){status.className='error';status.textContent='Upload not saved. '+err.message;button.disabled=false;button.innerHTML=icon('upload')+' Add to local library'}else notify('Upload not saved: '+err.message)}}
function route(){const requested=location.hash.slice(1).split('?')[0]||'home';current=['home','notes','papers','saved','teach'].includes(requested)?requested:'home';query='';subjectFilter='';gradeFilter='';sort='recommended';document.querySelectorAll('[data-page]').forEach(a=>{a.classList.toggle('active',a.dataset.page===current);if(a.dataset.page===current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.getElementById('crumb').textContent=({home:'Overview',notes:'Class notes',papers:'Sample papers',saved:'Saved resources',teach:'Teacher workspace'})[current];document.title=document.getElementById('crumb').textContent+' · Classnote';if(current==='home')home();else if(current==='teach')teach();else catalog();window.scrollTo(0,0)}
function showDetail(id){const r=resources.find(x=>x.id===id);if(!r)return;const box=document.getElementById('detail-content');box.innerHTML='<div class="dialog-top"><div class="tags"><span class="tag subject-tag">'+esc(r.subject)+'</span><span class="tag">Class '+esc(r.grade)+'</span><span class="tag">'+(r.local?'Local upload':'Illustrative demo')+'</span></div><button class="icon-btn" data-close aria-label="Close resource">'+icon('close')+'</button></div><h2>'+esc(r.title)+'</h2><div class="detail-meta">By '+esc(r.teacher)+' · '+(r.type==='notes'?'Class notes':'Sample paper')+'</div><p style="font-size:13px">'+esc(r.description)+'</p>'+(r.text?'<pre>'+esc(r.text)+'</pre>':'<div class="notice">'+esc(r.filename)+'<br>This is your original uploaded file. Download it to view it in your PDF reader or document editor. Files are stored on this browser only.</div>')+'<div class="actions"><button class="btn primary" data-download="'+esc(r.id)+'">'+icon('download')+' Download '+(r.local?'file':'demo TXT')+'</button><button class="btn" data-save="'+esc(r.id)+'">'+icon('bookmark')+' '+(saved.has(r.id)?'Saved':'Save for later')+'</button></div>';document.getElementById('detail').showModal()}
function download(id){const r=resources.find(x=>x.id===id);if(!r)return;const blob=r.local?r.file:new Blob([r.text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=r.local?r.filename:r.title.replace(/[^a-z0-9]+/gi,'-')+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('Download requested. Check your browser downloads.')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-save]');if(b){const id=b.dataset.save;if(saved.has(id))saved.delete(id);else saved.add(id);const persisted=persistSave();updateCount();if(current==='home')home();else if(['notes','papers','saved'].includes(current))renderResults();else if(current==='teach'){document.querySelectorAll('[data-save="'+id+'"]').forEach(el=>{el.classList.toggle('saved',saved.has(id));el.setAttribute('aria-pressed',saved.has(id));el.setAttribute('aria-label',(saved.has(id)?'Unsave ':'Save ')+resources.find(r=>r.id===id).title)})}const modal=document.querySelector('#detail [data-save="'+id+'"]');if(modal)modal.innerHTML=icon('bookmark')+' '+(saved.has(id)?'Saved':'Save for later');notify(persisted?(saved.has(id)?'Added to your saved resources.':'Removed from your saved resources.'):'Updated for this session only; browser saving is unavailable.');return}const open=e.target.closest('[data-open]');if(open)showDetail(open.dataset.open);const dl=e.target.closest('[data-download]');if(dl)download(dl.dataset.download);if(e.target.closest('[data-close]'))document.getElementById('detail').close();const sub=e.target.closest('[data-subject]');if(sub){const s=sub.dataset.subject;location.hash='notes';setTimeout(()=>{subjectFilter=s;catalog()},0)}});
document.getElementById('detail').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});window.addEventListener('hashchange',()=>{document.getElementById('detail').close();route()});route();
(async()=>{try{db=await new Promise((resolve,reject)=>{const req=indexedDB.open('classnote-library-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('resources',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Storage is blocked by another tab.'))});const local=await new Promise((resolve,reject)=>{const tx=db.transaction('resources','readonly');const req=tx.objectStore('resources').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});resources=[...local.sort((a,b)=>b.created-a.created),...seed];if(current==='home')home();else if(['notes','papers','saved'].includes(current))renderResults();else if(current==='teach'&&!document.getElementById('title').value&&!picked)teach();}catch(err){storageMessage='Browser file storage is unavailable. Uploads cannot be saved. '+(err.message||'');if(current==='teach'){const notice=document.querySelector('.notice');if(notice)notice.textContent=storageMessage+' This demo has no connected server.'}}})();
</script>
